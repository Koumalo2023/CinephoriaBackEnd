name: Deploy Backend to AWS

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: 'eu-west-3'
  DOCKER_IMAGE: 'cinephoria-backend'
  DOCKER_TAG: 'latest'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cinephoria-backend

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine environment and settings
      id: config
      run: |
        if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENV="production"
        else
          ENV="staging"
        fi
        echo "ENV=$ENV" >> $GITHUB_ENV
        echo "SERVICE_NAME=backend-$ENV" >> $GITHUB_ENV
        echo "IMAGE_FULL=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$ENV-latest" >> $GITHUB_ENV

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::852396292650:role/github-actions-cinephoria-backend
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActions-Backend-Deploy-${{ env.ENV }}

    - name: Get EC2 instance ID
      id: ec2
      run: |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Project,Values=Cinephoria" "Name=instance-state-name,Values=running" \
          --query "Reservations[0].Instances[0].InstanceId" \
          --output text)
        echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
        echo "Found instance: $INSTANCE_ID"

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        cd CinephoriaServer.API
        docker build -t ${{ env.IMAGE_FULL }} .

    - name: Push Docker image
      run: |
        docker push ${{ env.IMAGE_FULL }}

    - name: Deploy to EC2 via SSM
      run: |
        # Send command to update docker-compose and restart service
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            'cd /opt/cinephoria',
            'docker-compose pull',
            'docker-compose up -d $SERVICE_NAME'
          ]" \
          --output text

    - name: Verify deployment
      run: |
        echo "Deployment completed for $ENV."
        echo "API URL: https://$ENV-api.cinephoria.eu"