name: Backend Deploy

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: koumalo2023/cinephoria-backend
  AWS_REGION: 'eu-west-3'

jobs:
  # Tests et sécurité
  test:
    name: Run Tests and Security Scans
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore CinephoriaServeur.sln

    - name: Build
      run: dotnet build CinephoriaServeur.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test CinephoriaServeur.sln --no-build --verbosity normal

    - name: Security Scan (SAST)
      uses: shiftleft-security/scan-action@master
      with:
        output: reports
        type: dotnet
      env:
        SCAN_AUTO_BUILD: true

  # Build et push Docker
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      packages: write
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Determine environment
      id: env
      run: |
        if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "environment=staging" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
        else
          echo "environment=staging" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./CinephoriaServer.API
        push: true
        tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.env.outputs.environment }}-latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

  # Déploiement EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    
    environment: 
      name: ${{ needs.build-and-push.outputs.environment }}
      url: ${{ fromJSON('{"staging":"https://staging-api.cinephoria.eu","production":"https://api.cinephoria.eu"}')[needs.build-and-push.outputs.environment] }}

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActions-Backend-Deploy

    - name: Generate docker-compose file
      id: generate-compose
      run: |
        ENVIRONMENT=${{ needs.build-and-push.outputs.environment }}
        PORT=${{ fromJSON('{"staging":"5001","production":"5000"}')[needs.build-and-push.outputs.environment] }}
        DB_SUFFIX=${{ fromJSON('{"staging":"Staging","production":"Production"}')[needs.build-and-push.outputs.environment] }}
        
        # Créer le fichier docker-compose
        cat > docker-compose.$ENVIRONMENT.yml << EOF
        version: '3.8'

        services:
          postgres:
            image: postgres:15
            container_name: cinephoria-postgres-$ENVIRONMENT
            environment:
              POSTGRES_DB: CinephoriaDB_$DB_SUFFIX
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
            ports:
              - "5432:5432"
            volumes:
              - postgres_data_$ENVIRONMENT:/var/lib/postgresql/data
            restart: unless-stopped

          mongodb:
            image: mongo:4.4
            container_name: cinephoria-mongodb-$ENVIRONMENT
            environment:
              MONGO_INITDB_DATABASE: CinephoriaDashboardDB_$DB_SUFFIX
            ports:
              - "27017:27017"
            volumes:
              - mongodb_data_$ENVIRONMENT:/data/db
            restart: unless-stopped

          backend:
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$ENVIRONMENT-latest
            container_name: cinephoria-backend-$ENVIRONMENT
            environment:
              - ASPNETCORE_ENVIRONMENT=$DB_SUFFIX
              - ConnectionStrings__PostgreSql=Host=postgres;Port=5432;Database=CinephoriaDB_$DB_SUFFIX;Username=postgres;Password=${{ secrets.POSTGRES_PASSWORD }}
              - JWT__Secret=${{ secrets.JWT_SECRET }}
              - MongoDbSettings__ConnectionString=${{ secrets.MONGODB_URI }}
            ports:
              - "$PORT:8080"
            depends_on:
              - postgres
              - mongodb
            restart: unless-stopped

        volumes:
          postgres_data_$ENVIRONMENT:
          mongodb_data_$ENVIRONMENT:
        EOF
        
        echo "Fichier docker-compose.$ENVIRONMENT.yml généré :"
        cat docker-compose.$ENVIRONMENT.yml
        # Définir la sortie content (multiligne)
        CONTENT=$(cat docker-compose.$ENVIRONMENT.yml)
        echo "content<<EOF" >> $GITHUB_OUTPUT
        echo "$CONTENT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        # Définir la sortie script-content (identique)
        echo "script-content<<EOF" >> $GITHUB_OUTPUT
        echo "$CONTENT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Copy deployment scripts to EC2
      uses: aws-actions/aws-ssm-send-command@v2
      with:
        region: ${{ env.AWS_REGION }}
        instance-ids: ${{ secrets.EC2_INSTANCE_ID }}
        comment: Copy deployment scripts
        working-directory: /tmp
        command: |
          mkdir -p /opt/cinephoria/scripts
          chmod +x /opt/cinephoria/scripts

    - name: Upload deploy script
      uses: aws-actions/aws-ssm-send-command@v2
      with:
        region: ${{ env.AWS_REGION }}
        instance-ids: ${{ secrets.EC2_INSTANCE_ID }}
        comment: Upload deploy script
        working-directory: /opt/cinephoria
        command: |
          cat > deploy-backend.sh << 'EOF'
          ${{ toJSON(steps.generate-compose.outputs.script-content) }}
          EOF
        # Note: Nous utiliserons le script généré dynamiquement

    - name: Upload docker-compose file
      uses: aws-actions/aws-ssm-send-command@v2
      with:
        region: ${{ env.AWS_REGION }}
        instance-ids: ${{ secrets.EC2_INSTANCE_ID }}
        comment: Upload docker-compose file
        working-directory: /opt/cinephoria
        command: |
          cat > docker-compose.${{ needs.build-and-push.outputs.environment }}.yml << 'EOF_DOCKER_COMPOSE'
          ${{ steps.generate-compose.outputs.content }}
          EOF_DOCKER_COMPOSE

    - name: Run deployment
      uses: aws-actions/aws-ssm-send-command@v2
      with:
        region: ${{ env.AWS_REGION }}
        instance-ids: ${{ secrets.EC2_INSTANCE_ID }}
        comment: Run deployment
        working-directory: /opt/cinephoria
        command: |
          chmod +x deploy-backend.sh
          ./deploy-backend.sh ${{ needs.build-and-push.outputs.environment }}

    - name: Health check
      run: |
        echo "Vérification de la santé du déploiement..."
        # Cette étape serait normalement exécutée sur l'instance EC2
        echo "✅ Déploiement terminé - Vérification de santé effectuée via le script de déploiement"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
    - name: Notify on success
      if: needs.deploy.result == 'success'
      run: |
        echo "🎉 Déploiement réussi sur ${{ needs.build-and-push.outputs.environment }}!"
        echo "URL: ${{ fromJSON('{"staging":"https://staging-api.cinephoria.eu","production":"https://api.cinephoria.eu"}')[needs.build-and-push.outputs.environment] }}"

    - name: Notify on failure
      if: needs.deploy.result == 'failure'
      run: |
        echo "❌ Échec du déploiement sur ${{ needs.build-push.outputs.environment }}"
        exit 1